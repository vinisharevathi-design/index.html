<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Anu Baby ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6e8, #ffb6c1);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 30px rgba(214, 51, 132, 0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
        }

        .page {
            display: none;
        }

        .active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            margin-top: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .yes-btn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.1);
        }

        .no-btn {
            background-color: #6c757d;
            color: white;
            position: absolute;
            right: 20px;
            transition: all 0.2s ease;
        }

        .gift-box {
            font-size: 80px;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.3s ease;
            user-select: none;
        }

        .gift-box:hover {
            transform: scale(1.15) rotate(5deg);
        }

        .love-text {
            display: none;
            font-size: 26px;
            font-weight: bold;
            color: #ff4d6d;
            margin: 20px 0;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .next-btn {
            background-color: #d63384;
            color: white;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Page 1 -->
        <div class="page active" id="page1">
            <h1>Will you be mine forever? ❤️</h1>
            <div class="btn-container">
                <button class="yes-btn" onclick="goToPage('page2')">Yes 🥰</button>
                <button class="no-btn" id="noBtn1" onmouseover="moveNoButton('noBtn1')" onclick="moveNoButton('noBtn1')">No 😜</button>
            </div>
        </div>

        <!-- Page 2 -->
        <div class="page" id="page2">
            <h1>Tap the box to open your surprise! 🎁</h1>
            <div class="gift-box" id="giftBox" onclick="openGift()">🎁</div>
            <div class="love-text" id="loveMsg">ANU BABY LOVE YOU ❤️</div>
            <button class="next-btn" id="p2NextBtn" onclick="goToPage('page3')">Next ➡️</button>
        </div>

        <!-- Page 3 -->
        <div class="page" id="page3">
            <h1>Will you marry me in the future? 💍✨</h1>
            <div class="btn-container">
                <button class="yes-btn" onclick="goToPage('page4')">Yes! 💖</button>
                <button class="no-btn" id="noBtn2" onmouseover="moveNoButton('noBtn2')" onclick="moveNoButton('noBtn2')">No 😜</button>
            </div>
        </div>

        <!-- Final Page -->
        <div class="page" id="page4">
            <h1 style="font-size: 32px;">Yayyy! 🎉🥳</h1>
            <p style="font-size: 20px; color: #ff4d6d; font-weight: bold; margin-top: 15px;">
                I am the happiest person in the world! Love you forever Anu Baby! 😘❤️
            </p>
        </div>
    </div>

    <script>
        function moveNoButton(id) {
            const btn = document.getElementById(id);
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 60);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 60);

            btn.style.position = 'fixed';
            btn.style.left = `${Math.max(20, x)}px`;
            btn.style.top = `${Math.max(20, y)}px`;
        }

        function goToPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function openGift() {
            document.getElementById('giftBox').innerText = '💖';
            document.getElementById('loveMsg').style.display = 'block';
            document.getElementById('p2NextBtn').style.display = 'inline-block';
        }
    </script>

</body>
</html>
